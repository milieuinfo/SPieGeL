site_name: SPieGeL
site_description: Open-source, configurable Linked Data publishing server
site_url: https://milieuinfo.github.io/SPieGeL/
repo_url: https://github.com/milieuinfo/SPieGeL
repo_name: milieuinfo/SPieGeL
edit_uri: edit/main/docs/
copyright: © 2026 Vlaamse Overheid, Departement Omgeving · MIT licence

strict: true

validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Analysis:
      - analysis/README.md
      - Context:
          - Background: analysis/01-context/background.md
          - Scope: analysis/01-context/scope.md
          - Glossary: analysis/01-context/glossary.md
      - Current platform:
          - Functional overview: analysis/02-current-platform/functional-overview.md
          - Data domains: analysis/02-current-platform/data-domains.md
          - URI patterns: analysis/02-current-platform/uri-patterns.md
          - Request flows: analysis/02-current-platform/request-flows.md
          - Query catalogue: analysis/02-current-platform/query-catalogue.md
          - Client components: analysis/02-current-platform/client-components.md
          - Data-dependent HTML rendering: analysis/02-current-platform/html-rendering.md
      - Requirements:
          - Functional: analysis/03-requirements/functional.md
          - Non-functional: analysis/03-requirements/non-functional.md
          - Standards: analysis/03-requirements/standards.md
          - Traceability: analysis/03-requirements/traceability.md
          - Performance and availability: analysis/03-requirements/performance.md
          - Design system (Flux): analysis/03-requirements/design-system.md
      - Landscape:
