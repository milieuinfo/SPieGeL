site_name: SPieGeL
site_description: Open-source, configurable Linked Data publishing server
site_url: https://milieuinfo.github.io/SPieGeL/
repo_url: https://github.com/milieuinfo/SPieGeL
repo_name: milieuinfo/SPieGeL
edit_uri: edit/main/docs/
copyright: © 2026 Vlaamse Overheid, Departement Omgeving · MIT licence

strict: true

validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Analysis:
      - analysis/README.md
      - Context:
          - Background: analysis/01-context/background.md
          - Scope: analysis/01-context/scope.md
          - Glossary: analysis/01-context/glossary.md
      - Current platform:
          - Functional overview: analysis/02-current-platform/functional-overview.md
          - Data domains: analysis/02-current-platform/data-domains.md
          - URI patterns: analysis/02-current-platform/uri-patterns.md
          - Request flows: analysis/02-current-platform/request-flows.md
          - Query catalogue: analysis/02-current-platform/query-catalogue.md
          - Client components: analysis/02-current-platform/client-components.md
          - Data-dependent HTML rendering: analysis/02-current-platform/html-rendering.md
      - Requirements:
          - Functional: analysis/03-requirements/functional.md
          - Non-functional: analysis/03-requirements/non-functional.md
          - Standards: analysis/03-requirements/standards.md
          - Traceability: analysis/03-requirements/traceability.md
          - Design system (Flux): analysis/03-requirements/design-system.md
      - Landscape:
          - Comparison: analysis/04-landscape/comparison.md
          - LodView code review: analysis/04-landscape/lodview-code-review.md
          - Trifid code review: analysis/04-landscape/trifid-code-review.md
          - Prez code review: analysis/04-landscape/prez-code-review.md
          - ELDA code review: analysis/04-landscape/elda-code-review.md
      - Architecture:
          - Hexagonal design: analysis/05-architecture/hexagonal-design.md
          - Request flow: analysis/05-architecture/request-flow.md
          - Module structure: analysis/05-architecture/module-structure.md
      - Open questions: analysis/06-open-questions.md
  - Decisions:
      - adr/README.md
      - 0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - 0002 Documentation with MkDocs: adr/0002-documentation-as-markdown-with-mkdocs.md
      - 0003 Build with Jenkins: adr/0003-build-with-jenkins.md
      - 0004 Technology baseline: adr/0004-technology-baseline.md
      - 0005 Flux design system for HTML: adr/0005-flux-design-system-for-html.md
      - Template: adr/template.md
